# 이 폴더에서: docker compose up -d --build
# 프론트(nginx 경유): http://<서버>:3003  →  외부 프록시가 https://moyeolog.ruraeru.xyz 로 연결
# 백엔드 직접 접근:    http://<서버>:8083
# TLS는 외부 프록시에서 종료한다. 이 스택은 HTTP만 다룬다.
name: moyeolog

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.0
    container_name: moyeolog-db
    restart: unless-stopped
    command: --innodb-buffer-pool-size=512M
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moyeolog}
      MYSQL_USER: ${MYSQL_USER:-moyeolog_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 20s
      retries: 20
    networks:
      - backend-net
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1G

  app:
    build:
      context: ./MOYEOLOG_BE
    container_name: moyeolog-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://db:3306/moyeolog?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-moyeolog_user}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-${MYSQL_PASSWORD}}
      # 빈 DB에서 처음 띄울 때 테이블을 만들어야 하므로 update. 스키마가 안정되면 validate로 바꾼다.
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      # application.yml은 레포에 없으므로(gitignore) 필요한 값은 전부 환경변수로 넣는다.
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=10MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=10MB
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800000}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CORS_ALLOWED_ORIGINS=${APP_URL:-https://moyeolog.ruraeru.xyz}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0
    ports:
      - "${BACKEND_PORT:-8083}:8080"
    volumes:
      - app_images:/app/uploads
    networks:
      - frontend-net
      - backend-net
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v3/api-docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: ./MOYEOLOG_FE
      args:
        - NEXT_PUBLIC_KAKAO_MAP_API_KEY=${NEXT_PUBLIC_KAKAO_MAP_API_KEY}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://moyeolog.ruraeru.xyz}
    container_name: moyeolog-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://moyeolog.ruraeru.xyz}
      - NEXT_PUBLIC_KAKAO_MAP_API_KEY=${NEXT_PUBLIC_KAKAO_MAP_API_KEY}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://app:8080}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://moyeolog.ruraeru.xyz}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
    depends_on:
      - app
    networks:
      - frontend-net
    volumes:
      - fe_image_cache:/app/.next/cache/images
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # 3003 포트의 진입점. /api, /uploads 는 백엔드로, 나머지는 프론트로 보낸다.
  nginx:
    image: nginx:1.25-alpine
    container_name: moyeolog-nginx
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3003}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - app_images:/var/www/uploads:ro
    depends_on:
      - frontend
      - app
    networks:
      - frontend-net
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  db_data:
  app_images:
  fe_image_cache:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
