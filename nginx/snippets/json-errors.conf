# nginx 가 직접 만드는 오류(본문 한도 초과, rate limit)를 HTML 대신 JSON 으로 돌려준다.
# 백엔드 오류 응답과 같은 모양 {error, message, status}. 프론트는 message 를 그대로 보여 준다.
# (proxy_intercept_errors 가 꺼져 있으므로 백엔드·프론트가 보낸 4xx 는 그대로 통과한다.)
error_page 413 @json_413;
error_page 429 @json_429;
# 400/494 는 가로채지 않는다: 요청줄 해석 단계(%00, ..%2f 등)의 400 은 named location 으로
# 넘길 수 없어 nginx 가 500 을 낸다. 잘못된 요청은 nginx 기본 400 으로 둔다.

location @json_413 {
    default_type application/json;
    charset utf-8;
    charset_types application/json;
    return 413 '{"error":"PAYLOAD_TOO_LARGE","message":"파일이 너무 커요. 10MB 이하로 올려 주세요.","status":413}';
}

location @json_429 {
    default_type application/json;
    charset utf-8;
    charset_types application/json;
    return 429 '{"error":"TOO_MANY_REQUESTS","message":"요청이 너무 많아요. 잠시 후 다시 시도해 주세요.","status":429}';
}
