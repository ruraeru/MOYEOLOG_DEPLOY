# 프록시 location 공통 설정. location 안에 proxy_set_header / proxy_hide_header 를 하나라도 쓰면
# 바깥 레벨 것을 물려받지 않으므로, 프록시하는 location 마다 이 파일을 include 한다.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;

# 보안 헤더는 nginx(security-headers.conf)가 한 번만 붙인다.
# 백엔드(Spring Security)·프론트가 보낸 같은 헤더는 숨겨서 값이 두 번(DENY + SAMEORIGIN 등) 나가지 않게 한다.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Powered-By;
