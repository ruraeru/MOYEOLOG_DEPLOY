upstream frontend_upstream {
    server frontend:3000 max_fails=3 fail_timeout=10s;
}

upstream backend_upstream {
    server app:8080 max_fails=3 fail_timeout=10s;
}

# Rate Limiting configuration
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# Next 이미지 최적화(/_next/image)는 외부 이미지를 받아 변환·캐시하므로 따로 제한한다.
limit_req_zone $binary_remote_addr zone=image_limit:10m rate=10r/s;
# 이메일 가입·인증·비밀번호 찾기(공개 API, 메일 발송)와 비밀번호 로그인은 IP 당 분 단위로 따로 제한한다.
limit_req_zone $binary_remote_addr zone=account_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=credentials_limit:10m rate=20r/m;
# 실시간 갱신 스트림(/api/events) 접속. 재접속(탭 복귀·끊김 뒤 백오프)이 /api 제한(api_limit)을 쓰지 않게 따로 센다.
limit_req_zone $binary_remote_addr zone=events_limit:10m rate=60r/m;
# 스트림은 오래 열려 있으므로 IP 당 동시 연결 수도 막는다(사용자당 6개 상한은 백엔드가 건다). 공유기 하나 뒤의 여러 사람을 생각해 넉넉히.
limit_conn_zone $binary_remote_addr zone=events_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# peer= 는 실제로 접속해 온 주소(외부 프록시), 맨 앞은 복원된 클라이언트 IP
log_format proxied '$remote_addr peer=$realip_remote_addr [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';

# TLS는 외부 프록시에서 종료된다. 외부 프록시가 넘겨준 X-Forwarded-Proto를 그대로 전달하고,
# 없으면 https로 간주한다 (NextAuth 쿠키/콜백 URL이 https 기준으로 잡혀야 한다).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen 80;
    server_name moyeolog.ruraeru.xyz _;
    server_tokens off;

    # 접근 로그는 한 줄(proxied 형식)만. nginx 이미지 기본 nginx.conf 가 http 레벨에 access_log main 을
    # 두고 있어 http 레벨에 하나 더 쓰면 요청마다 두 줄이 남는다. server 레벨에 쓰면 그것만 적용된다.
    access_log /var/log/nginx/access.log proxied;

    # 요청은 외부 프록시(Caddy)를 거쳐 들어온다. rate limit과 로그가 실제 클라이언트 IP를 쓰도록
    # X-Forwarded-For를 신뢰하되, 그 프록시 주소에서 온 요청만 신뢰한다.
    # (범위를 넓히면 클라이언트가 X-Forwarded-For를 조작해 rate limit을 우회할 수 있다.)
    # 프록시 주소가 바뀌면 access 로그의 peer= 값을 보고 여기를 고친다.
    set_real_ip_from 172.30.1.10;
    real_ip_header X-Forwarded-For;

    # Nginx 프록시 버퍼 및 성능 튜닝
    client_body_buffer_size 128k;
    proxy_buffer_size 16k;
    proxy_buffers 4 64k;
    proxy_busy_buffers_size 96k;
    proxy_temp_file_write_size 96k;

    # Gzip 압축 설정
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/x-javascript text/javascript application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1024;

    # 보안 헤더 추가 및 Content-Security-Policy 설정
    # img-src 에 http: 는 두지 않는다. 화면 <head> 의 upgrade-insecure-requests 가 http 이미지(옛 카카오 프로필 URL 등)를
    # https 로 올려 받는다. form-action 의 kauth.kakao.com 은 NextAuth 기본 로그인 폼이 카카오로 넘기는 경우용.
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.kakao.com https://*.kakaocdn.net https://*.daumcdn.net https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; frame-src 'self' https://*.kakao.com; connect-src 'self' https://moyeolog.ruraeru.xyz https://*.kakao.com https://*.kakaocdn.net https://*.daumcdn.net https://cdn.jsdelivr.net; base-uri 'self'; form-action 'self' https://kauth.kakao.com; frame-ancestors 'self'; object-src 'none';" always;

    # 본문 한도는 백엔드(SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=10MB)와 같게 둔다.
    # nginx 한도가 더 크면 백엔드가 413 을 내고 나머지 본문을 읽지 않아, nginx 가 본문을 다 보내지 못한 채
    # proxy_send_timeout(60초)까지 매달렸다. 같게 두면 넘는 요청은 nginx 가 즉시 JSON 413 으로 끊는다.
    client_max_body_size 10m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;

    # nginx 가 직접 내는 413/429 를 JSON 으로 (snippets/json-errors.conf)
    include /etc/nginx/snippets/json-errors.conf;

    # Block suspicious Next-Action headers (used by vulnerability scanners, e.g. "x")
    # Next.js Server Action IDs are 40-character hashes.
    if ($http_next_action ~* "^[a-zA-Z0-9]{1,20}$") {
        return 400;
    }

    # Block and silent-drop requests to sensitive files / scanner targets
    location ~* /\.(?!well-known\/) {
        return 404;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|yaml|yml|config|ini|php|sql|bak|swp)$ {
        return 404;
        access_log off;
        log_not_found off;
    }

    # 1. 백엔드 내부 전용 인증 API는 외부에 노출하지 않는다.
    #    프론트(NextAuth)가 도커 내부망(http://app:8080)으로 직접 호출한다.
    location = /api/auth/sync {
        return 404;
    }

    location = /api/auth/refresh {
        return 404;
    }

    location = /api/auth/logout {
        return 404;
    }

    location = /api/auth/login {
        return 404;
    }

    location = /api/auth/link-kakao {
        return 404;
    }

    # 이메일·비밀번호 로그인(NextAuth Credentials). 비밀번호 대입을 늦춘다.
    location /api/auth/callback/credentials {
        limit_req zone=credentials_limit burst=10 nodelay;
        proxy_pass http://frontend_upstream/api/auth/callback/credentials;
        include /etc/nginx/snippets/proxy.conf;
    }

    # 2. Frontend NextAuth (session, providers 등) 및 프론트엔드 API
    location /api/auth {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://frontend_upstream/api/auth;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/search-image {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://frontend_upstream/api/search-image;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/proxy-image {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://frontend_upstream/api/proxy-image;
        include /etc/nginx/snippets/proxy.conf;
    }

    # 3. Backend API (그 외 모든 /api 요청)
    # AI 분석(메모·토픽)은 로컬 LLM 이라 1분을 넘길 수 있다.
    location ~ ^/api/(memos|topics)/[^/]+/analyze$ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_read_timeout 300s;
        proxy_pass http://backend_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # 이메일 가입·인증·비밀번호 찾기 (로그인 없이 부르는 공개 API, 메일을 보낸다)
    location /api/account/ {
        limit_req zone=account_limit burst=10 nodelay;
        proxy_pass http://backend_upstream/api/account/;
        include /etc/nginx/snippets/proxy.conf;
    }

    # 로그인 방법을 바꾸는 API(비밀번호·이메일·카카오 해제). 현재 비밀번호 대입과 메일 발송 남용을 막는다.
    location ~ ^/api/users/me/(password|email|kakao)$ {
        limit_req zone=account_limit burst=10 nodelay;
        proxy_pass http://backend_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # 실시간 갱신(SSE). 정확히 일치하는 location 이라 아래 /api 보다 먼저 맞는다.
    # 모아 보내지 않고(버퍼링·캐시·gzip 끔) 바로 흘려보낸다. 연결은 백엔드가 30분 안에 닫고(하트비트 25초),
    # proxy_read_timeout 은 그보다 길게 둔다. add_header 를 쓰지 않으므로 server 레벨 보안 헤더를 그대로 물려받는다.
    location = /api/events {
        limit_req zone=events_limit burst=30 nodelay;
        limit_conn events_conn 30;
        proxy_pass http://backend_upstream;
        include /etc/nginx/snippets/proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 2100s;
        gzip off;
    }

    location /api {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_upstream/api;
        include /etc/nginx/snippets/proxy.conf;
    }

    # 4. Static uploads (Served directly by Nginx for high performance)
    #    이미지 확장자만 이미지로 내려주고, 그 외 파일은 전부 다운로드(octet-stream)로 취급한다.
    #    업로드된 파일이 이 도메인에서 HTML/스크립트로 실행되는 것을 막는다.
    location /uploads/ {
        alias /var/www/uploads/;
        types {
            image/jpeg jpg jpeg;
            image/png  png;
            image/gif  gif;
            image/webp webp;
        }
        default_type application/octet-stream;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cache-Control "public, max-age=2592000, no-transform";
    }

    # Next.js Static Bundle Assets (Cached heavily for performance)
    location /_next/static/ {
        proxy_pass http://frontend_upstream/_next/static/;
        include /etc/nginx/snippets/proxy.conf;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_hide_header Cache-Control;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next 이미지 최적화. 로그인 없이 부를 수 있어 rate limit 을 건다 (허용 호스트는 프론트 next.config.ts).
    location /_next/image {
        limit_req zone=image_limit burst=50 nodelay;
        proxy_pass http://frontend_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # 5. Frontend UI
    location / {
        proxy_pass http://frontend_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
