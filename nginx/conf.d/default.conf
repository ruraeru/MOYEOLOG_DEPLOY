upstream frontend_upstream {
    server frontend:3000 max_fails=3 fail_timeout=10s;
}

upstream backend_upstream {
    server app:8080 max_fails=3 fail_timeout=10s;
}

# Rate Limiting configuration
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

# peer= 는 실제로 접속해 온 주소(외부 프록시), 맨 앞은 복원된 클라이언트 IP
log_format proxied '$remote_addr peer=$realip_remote_addr [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
access_log /var/log/nginx/access.log proxied;

# TLS는 외부 프록시에서 종료된다. 외부 프록시가 넘겨준 X-Forwarded-Proto를 그대로 전달하고,
# 없으면 https로 간주한다 (NextAuth 쿠키/콜백 URL이 https 기준으로 잡혀야 한다).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen 80;
    server_name moyeolog.ruraeru.xyz _;
    server_tokens off;

    # 요청은 외부 프록시(Caddy)를 거쳐 들어온다. rate limit과 로그가 실제 클라이언트 IP를 쓰도록
    # X-Forwarded-For를 신뢰하되, 그 프록시 주소에서 온 요청만 신뢰한다.
    # (범위를 넓히면 클라이언트가 X-Forwarded-For를 조작해 rate limit을 우회할 수 있다.)
    # 프록시 주소가 바뀌면 access 로그의 peer= 값을 보고 여기를 고친다.
    set_real_ip_from 172.30.1.10;
    real_ip_header X-Forwarded-For;

    # Nginx 프록시 버퍼 및 성능 튜닝
    client_body_buffer_size 128k;
    proxy_buffer_size 16k;
    proxy_buffers 4 64k;
    proxy_busy_buffers_size 96k;
    proxy_temp_file_write_size 96k;

    # Gzip 압축 설정
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/x-javascript text/javascript application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1024;

    # 보안 헤더 추가 및 Content-Security-Policy 설정
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.kakao.com https://*.kakaocdn.net https://*.daumcdn.net https://cdn.jsdelivr.net; img-src 'self' data: blob: https: http:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; frame-src 'self' https://*.kakao.com; connect-src 'self' https://moyeolog.ruraeru.xyz https://*.kakao.com https://*.kakaocdn.net https://*.daumcdn.net https://cdn.jsdelivr.net;" always;

    client_max_body_size 50M;
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;

    # Block suspicious Next-Action headers (used by vulnerability scanners, e.g. "x")
    # Next.js Server Action IDs are 40-character hashes.
    if ($http_next_action ~* "^[a-zA-Z0-9]{1,20}$") {
        return 400;
    }

    # Block and silent-drop requests to sensitive files / scanner targets
    location ~* /\.(?!well-known\/) {
        return 404;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|yaml|yml|config|ini|php|sql|bak|swp)$ {
        return 404;
        access_log off;
        log_not_found off;
    }

    # 1. 백엔드 내부 전용 인증 API는 외부에 노출하지 않는다.
    #    프론트(NextAuth)가 도커 내부망(http://app:8080)으로 직접 호출한다.
    location = /api/auth/sync {
        return 404;
    }

    location = /api/auth/refresh {
        return 404;
    }

    # 2. Frontend NextAuth (session, providers 등) 및 프론트엔드 API
    location /api/auth {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://frontend_upstream/api/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /api/search-image {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://frontend_upstream/api/search-image;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /api/proxy-image {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://frontend_upstream/api/proxy-image;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 3. Backend API (그 외 모든 /api 요청)
    location /api {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_upstream/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 4. Static uploads (Served directly by Nginx for high performance)
    #    이미지 확장자만 이미지로 내려주고, 그 외 파일은 전부 다운로드(octet-stream)로 취급한다.
    #    업로드된 파일이 이 도메인에서 HTML/스크립트로 실행되는 것을 막는다.
    location /uploads/ {
        alias /var/www/uploads/;
        types {
            image/jpeg jpg jpeg;
            image/png  png;
            image/gif  gif;
            image/webp webp;
        }
        default_type application/octet-stream;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cache-Control "public, max-age=2592000, no-transform";
    }

    # Next.js Static Bundle Assets (Cached heavily for performance)
    location /_next/static/ {
        proxy_pass http://frontend_upstream/_next/static/;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_hide_header Cache-Control;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 5. Frontend UI
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
